services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SAMPLE_SITE_BASE_URL: http://sample-site:8000
      SAMPLE_SITE_PREFIX: /sample
    ports:
      - "8000:8000"
    depends_on:
      sample-site:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 5s

  sample-site:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "sample_site.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 5s
